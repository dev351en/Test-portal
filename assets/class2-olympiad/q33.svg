      <rect x="44" y="62" width="62" height="46" rx="5" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1.8"/>
      <circle cx="75" cy="85" r="12" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1"/>
      <!-- Arms -->
      <rect x="22" y="65" width="18" height="9" rx="2" fill="#93C5FD" stroke="#2563EB" stroke-width="1.2"/>
      <rect x="110" y="65" width="18" height="9" rx="2" fill="#93C5FD" stroke="#2563EB" stroke-width="1.2"/>
      <!-- Legs -->
      <rect x="52" y="110" width="12" height="14" fill="#2563EB"/>
