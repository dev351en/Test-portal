      <polygon points="108,24 118,6 98,14" fill="#F59E0B" stroke="#D97706" stroke-width="1.2"/>
      <!-- Head -->
      <rect x="38" y="20" width="74" height="38" rx="6" fill="#60A5FA" stroke="#2563EB" stroke-width="1.8"/>
      <!-- Eyes -->
      <circle cx="58" cy="36" r="6" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.2"/>
      <circle cx="58" cy="36" r="2.5" fill="#1E293B"/>
      <circle cx="92" cy="36" r="6" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.2"/>
      <circle cx="92" cy="36" r="2.5" fill="#1E293B"/>
      <!-- 1 Nose Triangle -->
      <polygon points="75,41 69,50 81,50" fill="#EF4444" stroke="#B91C1C" stroke-width="1.2"/>
